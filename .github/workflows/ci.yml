name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified official commit
        with:
          persist-credentials: false
      - name: Offline acceptance and regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m compileall -q telegram_link_checker.py scripts tests
